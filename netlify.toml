# Site statique : aucune compilation, Netlify publie le dossier tel quel.
[build]
  command = "echo 'Site statique, pas de build'"
  publish = "."

# Le contenu est relu à chaque visite pour voir tout de suite les modifications
[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
