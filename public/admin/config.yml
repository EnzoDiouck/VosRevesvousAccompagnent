backend:
  name: git-gateway
  branch: main

# Nécessite Netlify Identity + Git Gateway activés sur le site Netlify
# (Site settings → Identity, puis → Git Gateway).

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "settings"
    label: "Réglages du site"
    files:
      - file: "content/settings.json"
        label: "Réglages généraux"
        name: "settings"
        fields:
          - label: "Lien de réservation Google Calendar"
            name: "bookingUrl"
            widget: "string"
            required: false
            hint: "Lien de la page de réservation (rendez-vous) créée dans Google Calendar. Laissez vide pour afficher un bouton de contact par email à la place."
          - label: "Note sur l'agenda"
            name: "bookingNote"
            widget: "string"
            hint: "ex. Agenda ouvert pour mai — juillet 2026"
          - label: "Info séance / acompte"
            name: "bookingDetails"
            widget: "string"
            hint: "ex. Séances de 1 h à 6 h. Acompte de 30 % à la réservation."
          - label: "Lien boutique Etsy"
            name: "etsyUrl"
            widget: "string"
          - label: "Lien Instagram"
            name: "instagramUrl"
            widget: "string"
          - label: "Email de contact"
            name: "email"
            widget: "string"
          - label: "Téléphone"
            name: "phone"
            widget: "string"

  - name: "flashs"
    label: "Flashs disponibles"
    folder: "content/flashs"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - label: "Ordre d'affichage"
        name: "order"
        widget: "number"
        default: 0
        hint: "Les flashs s'affichent du plus petit au plus grand numéro."

  - name: "realisations"
    label: "Réalisations (Instagram)"
    folder: "content/realisations"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - label: "Lien du post Instagram"
        name: "url"
        widget: "string"
        hint: "Collez le lien du post, ex. https://www.instagram.com/p/XXXXXXXXX/"
      - label: "Ordre d'affichage"
        name: "order"
        widget: "number"
        default: 0

  - name: "articles"
    label: "Articles du journal"
    folder: "content/articles"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - label: "Slug (URL de l'article)"
        name: "slug"
        widget: "string"
        hint: "Sans espaces ni accents, ex. mon-nouvel-article"
      - { label: "Résumé", name: "excerpt", widget: "text" }
      - label: "Date"
        name: "date"
        widget: "string"
        hint: "ex. 12 mars 2026"
      - { label: "Catégorie", name: "category", widget: "string" }
      - { label: "Image de couverture", name: "cover", widget: "image" }
      - label: "Contenu"
        name: "content"
        widget: "text"
        hint: "Séparez chaque paragraphe par une ligne vide."
      - label: "Ordre d'affichage"
        name: "order"
        widget: "number"
        default: 0
        hint: "Les articles les plus récents doivent avoir le plus grand numéro."
